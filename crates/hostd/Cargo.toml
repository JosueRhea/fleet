[package]
name = "hostd"
version = "0.1.0"
edition = "2021"
description = "ccloud host agent: OCI image -> Firecracker microVM, TAP networking, scale-to-zero via snapshots"

[dependencies]
anyhow = "1"
ccloud-proto = { path = "../proto" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
